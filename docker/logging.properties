.level=INFO
handlers=java.util.logging.FileHandler, java.util.logging.ConsoleHandler

# Root logger filter to suppress specific messages
java.util.logging.Logger.level=INFO

java.util.logging.ConsoleHandler.level=INFO
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=[%1$tF %1$tT] [%4$-7s] %5$s %n

java.util.logging.FileHandler.level=INFO
java.util.logging.FileHandler.pattern=/var/log/clickhouse-jdbc-bridge/console.log
java.util.logging.FileHandler.limit=10000000
java.util.logging.FileHandler.count=5
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter
io.vertx.core.impl.BlockedThreadChecker.level=OFF

# Suppress noisy Vert.x router exception messages including "Unhandled exception in router"
io.vertx.core.impl.ContextImpl.level=OFF
io.vertx.ext.web.impl.RoutingContextImpl.level=OFF
io.vertx.ext.web.impl.RoutingContextWrapper.level=OFF
io.vertx.ext.web.handler.impl.level=OFF
io.vertx.ext.web.level=OFF
io.vertx.core.level=OFF

# Additional suppressions for router-related severe messages
io.vertx.ext.web.impl.level=OFF
io.vertx.core.impl.level=OFF
io.vertx.core.net.impl.level=OFF

# Suppress all Vert.x router and core logging to prevent "Unhandled exception in router"
io.vertx.level=OFF
io.vertx.ext.level=OFF
io.vertx.core.http.level=OFF
io.vertx.core.http.impl.level=OFF
io.vertx.ext.web.handler.level=OFF

# Even more specific suppressions
io.vertx.ext.web.impl.RouterImpl.level=SEVERE
io.vertx.ext.web.Route.level=OFF
io.vertx.ext.web.Router.level=OFF
